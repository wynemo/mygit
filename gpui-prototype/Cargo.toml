[package]
name = "mygit-gpui"
version = "0.1.0"
edition = "2024"

[features]
default = ["ui"]
ui = ["dep:gpui"]

[[bin]]
name = "mygit-gpui"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
gpui = { version = "=0.2.2", optional = true }
anyhow = "1"
serde_json = "1"
similar = "2"
unicode-segmentation = "1.12"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
