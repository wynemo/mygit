name: Build Rust

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rust-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype

      - name: Prepare Metal toolchain
        run: |
          test "$(uname -m)" = arm64
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build and package app
        run: |
          python3 gpui-prototype/scripts/package_macos.py
          lipo gpui-prototype/dist/MyGit.app/Contents/MacOS/MyGit -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent \
            gpui-prototype/dist/MyGit.app gpui-prototype/dist/MyGit-macos-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGit-macos-arm64
          path: gpui-prototype/dist/MyGit-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-prototype

      - name: Locate Windows shader compiler
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem "$sdkBin\*\x64\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "Windows SDK fxc.exe was not found" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Build release executable
        run: cargo build --locked --release --manifest-path gpui-prototype/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package executable
        run: |
          New-Item -ItemType Directory -Force gpui-prototype/dist | Out-Null
          Copy-Item gpui-prototype/target/x86_64-pc-windows-msvc/release/mygit-gpui.exe gpui-prototype/dist/MyGit.exe
          Compress-Archive -Path gpui-prototype/dist/MyGit.exe -DestinationPath gpui-prototype/dist/MyGit-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGit-windows-x86_64
          path: gpui-prototype/dist/MyGit-windows-x86_64.zip
          if-no-files-found: error
